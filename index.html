<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caja · Bulldog Burger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F7F2;--card:#FFFFFF;--ink:#1D1A16;--muted:#6B655C;--line:#E4E1D8;--mostaza:#F4B400;--mostaza-ink:#3A2A00;--ketchup:#C8282B;--pepinillo:#2F7A2B;--soft:#FFF4CC;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17150F;--card:#221F18;--ink:#F3EFE6;--muted:#ABA393;--line:#38332A;--soft:#3A2F0B;--ketchup:#EF5350;--pepinillo:#6CC26A}}
:root[data-theme="dark"]{--bg:#17150F;--card:#221F18;--ink:#F3EFE6;--muted:#ABA393;--line:#38332A;--soft:#3A2F0B;--ketchup:#EF5350;--pepinillo:#6CC26A}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.4}
header{display:flex;align-items:baseline;justify-content:space-between;padding:18px 18px 6px;max-width:760px;margin:0 auto}
h1{font-stretch:68%;font-weight:900;font-size:34px;line-height:1;margin:0;letter-spacing:-.5px}
h2{font-stretch:75%;font-weight:800;font-size:24px;margin:22px 0 10px}
.estado{font-size:13px;color:var(--muted)}
main{max-width:760px;margin:0 auto;padding:0 16px 110px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;max-width:150px;background:none;border:0;padding:10px 4px 12px;font:inherit;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:22px}
nav button[aria-current="page"]{color:var(--ink);font-weight:800;box-shadow:inset 0 3px 0 var(--mostaza)}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mostaza);outline-offset:2px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.prod{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;cursor:pointer;position:relative;min-height:104px}
.prod:active{transform:scale(.97)}
.prod .em{font-size:30px;display:block}
.prod b{display:block;font-size:17px;line-height:1.15;margin-top:4px}
.prod small{color:var(--muted);font-size:15px}
.prod .n{position:absolute;top:8px;right:8px;background:var(--mostaza);color:var(--mostaza-ink);font-weight:900;border-radius:99px;min-width:30px;height:30px;display:grid;place-items:center;font-size:16px}
.ticket{background:var(--soft);border-radius:16px;padding:14px;margin-top:14px}
.ticket .fila{display:flex;align-items:center;gap:8px;padding:4px 0}
.ticket .fila span{flex:1}
.mini{border:1px solid var(--line);background:var(--card);border-radius:10px;width:38px;height:38px;font-size:20px;font-weight:700;cursor:pointer}
.total{font-stretch:70%;font-weight:900;font-size:40px;line-height:1;margin:8px 0 12px}
.pagar{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:12px;padding:15px 12px;font-weight:800;font-size:18px;cursor:pointer;background:var(--mostaza);color:var(--mostaza-ink)}
.btn.alt{background:var(--ink);color:var(--bg)}
.btn.rojo{background:var(--ketchup);color:#fff}
.btn.plano{background:var(--card);border:2px solid var(--line);color:var(--ink);font-weight:700}
.btn:disabled{opacity:.4}
.lista{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item .txt{flex:1;min-width:0}
.item .txt small{display:block;color:var(--muted);font-size:14px}
.item .monto{font-weight:800;white-space:nowrap}
.x{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:14px}
.x.seguro{background:var(--ketchup);color:#fff;border-color:var(--ketchup)}
.vacio{color:var(--muted);padding:16px;text-align:center}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select{font:inherit;width:100%;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.monto-in{font-size:34px;font-weight:900;font-stretch:72%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:9px 14px;cursor:pointer;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.inv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:14px;border-top:1px solid var(--line)}
.inv:first-child{border-top:0}
.inv .cant{font-stretch:70%;font-weight:900;font-size:34px;line-height:1;text-align:right}
.inv.bajo .cant{color:var(--ketchup)}
.inv .ctrl{grid-column:1/-1;display:flex;gap:8px}
.inv .ctrl input{flex:1;min-width:0}
.inv .ctrl button{white-space:nowrap}
.aviso{color:var(--ketchup);font-weight:700;font-size:14px}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cifra{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.cifra small{color:var(--muted);font-size:14px}
.cifra b{display:block;font-stretch:70%;font-weight:900;font-size:clamp(22px,6vw,32px);line-height:1.1}
.cifra.gan b{color:var(--pepinillo)}
.cifra.neg b{color:var(--ketchup)}
.tabla{width:100%;border-collapse:collapse;background:var(--card);border-radius:14px;overflow:hidden;font-size:15px}
.tabla th,.tabla td{padding:9px 10px;text-align:right;border-top:1px solid var(--line)}
.tabla th:first-child,.tabla td:first-child{text-align:left}
.tabla th{font-weight:700;color:var(--muted);border-top:0}
.scroll{overflow-x:auto}
.cfg{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.cfg .r{display:grid;grid-template-columns:56px 1fr 90px auto;gap:8px;align-items:center}
.cfg .r2{display:grid;grid-template-columns:1fr 90px auto;gap:8px;align-items:center}
.cfg .usa{margin-top:8px;font-size:14px;color:var(--muted)}
.cfg .usa label{display:inline-flex;align-items:center;gap:4px;margin:4px 10px 0 0;font-weight:500;color:var(--ink)}
.cfg .usa input{width:auto}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.nota{color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.prod:active{transform:none}}
</style>
</head>

function dbApi(db){

  watchTodo(desde,cb){let v=[],g=[],f=[];const m=s=>s.docs.map(x=>x.data());

  const C0=S.config.cierres||{};if(C0[f]&&C0[f].partida)ci[f]=firebase.firestore.FieldValue.delete();
  ci[ay]={fecha:ay,ts,hora:pad(t.getHours())+':'+pad(t.getMinutes()),por:YO,partida:true,contado:ef,esperado:ef,diferencia:0,fondoDeja:fd,guardado:r2(ef-fd)};
  await guardar(()=>api.patchConfig({inicio:{monto:ef,yappy:ya,ts,fecha:ay},retiros:[],cierres:ci}),'Punto de partida guardado');
  avisar('Punto de partida','Efectivo '+fmt(ef)+' ('+fmt(fd)+' carrito, '+fmt(ef-fd)+' local) · Yappy '+fmt(ya)+' · por '+YO);S.tab='mes';render()}
 else if(A==='sem'){S.sem=Math.min(0,S.sem+(+b.dataset.d));render()}
 else if(A==='preborrar'){S.borrar=b.dataset.col+':'+id;render()}
 else if(A==='borrar'){const col=b.dataset.col;S.borrar=null;const v=(col==='ventas'?S.ventas:S.gastos).find(x=>x.id===id);
  await guardar(async()=>{await api.del(col,id);if(col==='ventas'&&v){const p=consumo(v.items,1);if(Object.keys(p).length)await api.setStock(p)}
   if(v){const rec={col,item:v,ts:Date.now(),fecha:hoy(),por:YO};await api.patchConfig({papelera:firebase.firestore.FieldValue.arrayUnion(rec)});avisar('🗑 Borró '+(col==='ventas'?'venta':'gasto')+' '+fmt(col==='ventas'?v.total:v.monto),descBorrado(rec)+' · borró '+YO)}},'Borrado (queda en Resumen → Borrados)')}
 else if(A==='recuperar'){const rec=(S.config.papelera||[])[+b.dataset.i];if(!rec||!confirm('¿Recuperar: '+descBorrado(rec)+'?'))return;
  await guardar(async()=>{await api.add(rec.col,rec.item);if(rec.col==='ventas'){const p=consumo(rec.item.items||[],-1);if(Object.keys(p).length)await api.setStock(p)}
   await api.patchConfig({papelera:firebase.firestore.FieldValue.arrayRemove(rec)})},'Recuperado');avisar('♻️ Recuperó '+(rec.col==='ventas'?'venta':'gasto'),descBorrado(rec)+' · por '+YO)}
 else if(A==='cat'){S.cat=b.dataset.v;document.querySelectorAll('[data-act="cat"]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===S.cat))}
 else if(A==='con'){S.con=b.dataset.v;document.querySelectorAll('[data-act="con"]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===S.con))}
 else if(A==='gastar'){const m=r2(parseFloat(document.getElementById('gMonto').value));
  if(!S.cat)return toast('Elige en qué se gastó');if(!(m>0))return toast('Escribe cuánto fue');if(!api)return toast('Espera un momento, cargando…');
  const f=hoy(),d=new Date(),g={id:uid(),fecha:f,mes:f.slice(0,7),ts:Date.now(),hora:pad(d.getHours())+':'+pad(d.getMinutes()),categoria:S.cat,monto:m,nota:document.getElementById('gNota').value.trim(),con:S.con||'Carrito',por:YO,uid:firebase.auth().currentUser.uid};
  document.getElementById('gMonto').value='';document.getElementById('gNota').value='';S.cat=null;S.con='Carrito';render();
  await guardar(()=>api.add('gastos',g),'Gasto guardado: '+fmt(m));avisar('Gasto '+fmt(m)+' · '+g.categoria,(g.nota||'')+' · por '+YO)}
 else if(A==='entra'||A==='fija'){const inp=document.getElementById('q_'+id),q=parseFloat(inp.value);
  if(isNaN(q))return toast('Escribe la cantidad primero');const nuevo=A==='entra'?r2((+S.stock[id]||0)+q):q;inp.value='';document.activeElement.blur();
  await guardar(()=>api.setStock({[id]:nuevo}),(A==='entra'?'Sumado. ':'Corregido. ')+'Ahora hay '+nuevo)}
 else if(A==='nuevoP'){S.draft.productos.push({id:uid(),em:'🌭',nombre:'Nuevo producto',precio:0,receta:[]});render()}
 else if(A==='quitarP'){S.draft.productos.splice(+b.dataset.i,1);render()}
 else if(A==='nuevoI'){S.draft.insumos.push({id:uid(),nombre:'Nuevo insumo',minimo:5});render()}
 else if(A==='quitarI'){const x=S.draft.insumos.splice(+b.dataset.i,1)[0];S.draft.productos.forEach(p=>p.receta=(p.receta||[]).filter(r=>r!==x.id));render()}
 else if(A==='descartar'){S.draft=null;render()}
 else if(A==='guardarCfg'){if(!api)return;const D=S.draft;D.productos.forEach(p=>p.precio=r2(+p.precio||0));D.insumos.forEach(i=>i.minimo=+i.minimo||0);
  document.activeElement.blur();await guardar(()=>api.patchConfig({productos:D.productos,insumos:D.insumos,categorias:D.categorias,pagos:D.pagos,compras:D.compras||[]}),'Ajustes guardados');S.draft=null;render()}
});
document.getElementById('app').addEventListener('input',e=>{
 const t=e.target;
 if(t.id==='cuenta'){S.cuenta=t.value;const el=document.getElementById('cuadre');if(el)el.textContent=txtCuadre(datosCierre());return}
 if(t.id==='mxYappy'){S.mxY=t.value;const el=document.getElementById('mxEf');if(el)el.textContent=txtResto(totalTicket());return}
 if(!S.draft)return;
 if(t.dataset.f){const[k,i,f]=t.dataset.f.split('.');S.draft[k][+i][f]=t.value}
 else if(t.dataset.list){S.draft[t.dataset.list]=t.value.split(',').map(s=>s.trim()).filter(Boolean)}
});
document.getElementById('app').addEventListener('change',e=>{
 const t=e.target;
 if(t.id==='mesSel'&&t.value){verMes(t.value);t.blur()}
 if(t.dataset.rec!=null&&S.draft){const p=S.draft.productos[+t.dataset.rec];p.receta=p.receta||[];if(t.checked){if(!p.receta.includes(t.value))p.receta.push(t.value)}else p.receta=p.receta.filter(r=>r!==t.value)}
});
document.addEventListener('focusout',()=>setTimeout(()=>{if(S.pend&&!(document.activeElement&&document.activeElement.matches('input')))render()},300));

render();
firebase.initializeApp(FIREBASE_CONFIG);
const fdb=firebase.firestore();
fdb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
firebase.auth().onAuthStateChanged(u=>{
 if(!u){YO=null;S.admin=false;render();return}
 const k=(u.email||'').split('@')[0];
 YO=Object.keys(CUENTAS).find(n=>CUENTAS[n]===k)||u.email;
 S.admin=ADMINS.includes(k);S.tab='vender';
 if(!api){api=dbApi(fdb);conectar()}
 render();
});
</script>
</body>
</html>
